<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Sync Call</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --bg: #0a0f1d; --card: #1e293b; --green: #25D366; --red: #ff3b30; }

        body {
            margin: 0; padding: 0; background: transparent !important;
            font-family: 'Segoe UI', sans-serif; height: 100vh;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        .login-container {
            width: 90%; max-width: 350px; background: var(--bg);
            border-radius: 30px; padding: 40px 20px; position: relative;
            text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.9);
            border: 1px solid rgba(255,255,255,0.1); -webkit-app-region: drag;
        }

        .close-btn, .cam-icon, input, .login-submit, .profile-area { -webkit-app-region: no-drag; }

        .close-btn { position: absolute; top: 15px; right: 20px; color: #718096; cursor: pointer; font-size: 26px; z-index: 1000; }
        .close-btn:hover { color: var(--red); }

        .profile-area { position: relative; width: 110px; height: 110px; margin: 0 auto 25px; }

        .dp-circle { width: 100%; height: 100%; border-radius: 50%; background: var(--card); border: 3px solid var(--green); display: flex; justify-content: center; align-items: center; overflow: hidden; }

        .dp-circle i { font-size: 45px; color: var(--green); }
        .dp-circle img { width: 100%; height: 100%; object-fit: cover; display: none; }

        .cam-icon {
            position: absolute; bottom: 2px; right: 5px;
            background: var(--green); width: 32px; height: 32px;
            border-radius: 50%; display: flex; justify-content: center;
            align-items: center; color: white; border: 2px solid var(--bg);
            cursor: pointer;
        }

        .input-wrapper { position: relative; width: 85%; margin: 0 auto 30px; }

        .input-wrapper i {
            position: absolute; left: 12px; top: 50%;
            transform: translateY(-50%); color: var(--green);
        }

        .input-wrapper input {
            width: 100%; padding: 12px 10px 12px 40px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; color: white; outline: none;
            box-sizing: border-box;
        }

        .login-submit {
            width: auto; min-width: 140px;
            padding: 12px 30px;
            background: var(--green);
            color: white; border: none;
            border-radius: 15px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-submit:active { transform: scale(0.95); }
    </style>
</head>

<body>

<div class="login-container">
    <div class="close-btn" id="exitBtn"><i class="fas fa-times-circle"></i></div>

    <div class="profile-area">
        <div class="dp-circle">
            <i class="fas fa-user" id="defIcon"></i>
            <img src="" id="imgPreview">
        </div>
        <label for="fileInput" class="cam-icon">
            <i class="fas fa-camera"></i>
        </label>
        <input type="file" id="fileInput" hidden accept="image/*" onchange="loadImg(this)">
    </div>

    <h2 style="color:white; margin:0; font-size: 22px;">Create Account</h2>
    <p style="color:#a0aec0; font-size:14px; margin-bottom:20px;">Welcome to <b>Sync Call</b></p>

    <div class="input-wrapper">
        <i class="fas fa-user-edit"></i>
        <input type="text" id="fullName" placeholder="Enter Full Name">
    </div>

    <button class="login-submit" id="loginBtn" onclick="doLogin()">Login</button>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>
// --- CONFIGURATION ---
const SERVER_URL = "http://localhost:3000"; 

const { ipcRenderer } = (typeof require !== 'undefined') ? require('electron') : { ipcRenderer: null };

function loadImg(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = document.getElementById('imgPreview');
            img.src = e.target.result;
            img.style.display = 'block';
            document.getElementById('defIcon').style.display = 'none';
        };
        reader.readAsDataURL(input.files[0]);
    }
}

async function doLogin() {
    const name = document.getElementById('fullName').value.trim();
    const preview = document.getElementById('imgPreview').src;
    const loginBtn = document.getElementById('loginBtn');

    if (!name) {
        alert("Please enter your name");
        return;
    }

    loginBtn.innerText = "Connecting...";
    loginBtn.disabled = true;

    // 8-digit unique ID
    const userId = Math.floor(10000000 + Math.random() * 90000000).toString();
    const profileData = (preview && preview.startsWith("data:")) ? preview : "";

    // ڈیٹا لوکل اسٹوریج میں محفوظ کریں (تاکہ سرور نہ بھی چلے تو ڈیش بورڈ ڈیٹا دکھا سکے)
    localStorage.setItem("myUserID", userId);
    localStorage.setItem("myUserName", name);
    localStorage.setItem("myUserPic", profileData);

    // موبائل اور آف لائن کے لیے ایک چھوٹا ٹائم آؤٹ (اگر 3 سیکنڈ میں جواب نہ ملے تو خود ہی ڈیش بورڈ پر چلے جائیں)
    const timeout = setTimeout(() => {
        window.location.href = "dashboard.html";
    }, 3000);

    try {
        const response = await fetch(`${SERVER_URL}/api/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                username: name,
                dp: profileData
            })
        });

        clearTimeout(timeout); // اگر جواب مل گیا تو ٹائم آؤٹ ختم کر دیں
        window.location.href = "dashboard.html";
        
    } catch (err) { 
        console.log("Offline Mode: Moving to dashboard..."); 
        clearTimeout(timeout);
        window.location.href = "dashboard.html";
    }
}

document.getElementById('exitBtn').onclick = () => {
    if (ipcRenderer) ipcRenderer.send("close-app");
    else window.close();
};
</script>

</body>
</html>
